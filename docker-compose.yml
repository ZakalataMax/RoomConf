version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roomconf-backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend/data:/app/data
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    networks:
      - roomconf-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roomconf-frontend
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - roomconf-network
    restart: unless-stopped

networks:
  roomconf-network:
    driver: bridge

