version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roomconf-backend-dev
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - roomconf-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: roomconf-frontend-dev
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - roomconf-network
    command: npm run dev -- --host

networks:
  roomconf-network:
    driver: bridge

